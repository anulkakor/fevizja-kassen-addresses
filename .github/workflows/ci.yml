
name: FeVizja Kassen Addresses CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: node scripts/prepare-wrangler-ci.mjs
      - run: npx wrangler deploy --dry-run --env staging --config wrangler.ci.toml
      - run: npx wrangler deploy --dry-run --env production --config wrangler.ci.toml
